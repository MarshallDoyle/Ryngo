# .codegraph.yml — polyglot starter
#
# Generated by `codegraph init --template polyglot`. Tuned for repositories
# that mix multiple languages (e.g. TypeScript frontend + Python or Go
# backend + Terraform infra). Boundaries are language-shaped by default;
# refactor toward feature-shaped boundaries when the layout settles.

schemaVersion: 1

project:
  name: __PROJECT_NAME__

# >>> BOUNDARIES_BLOCK >>>
boundaries:
  frontend:
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.js"
    - "**/*.jsx"
  backend:
    - "**/*.go"
    - "**/*.py"
    - "**/*.rs"
    - "**/*.java"
  infra:
    - "**/*.tf"
    - "deploy/**"
    - ".github/workflows/**"
# <<< BOUNDARIES_BLOCK <<<

ignore:
  - "**/*.generated.*"
  - "**/*.gen.*"
  - "**/__pycache__/**"
  - "**/target/**"
  - "vendor/**"

# >>> ADAPTERS_BLOCK >>>
# <<< ADAPTERS_BLOCK <<<

output:
  ir:
    path: ".codegraph/ir.json"
    pretty: false
  cache:
    path: ".codegraph/cache"
    enabled: true
