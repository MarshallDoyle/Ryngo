# .codegraph.yml — monorepo starter
#
# Generated by `codegraph init --template monorepo`. Tuned for repositories
# with `apps/*` and `packages/*` (or `services/*`) folder layouts. Adjust
# the boundary globs to match your tree.

schemaVersion: 1

project:
  name: __PROJECT_NAME__

# >>> BOUNDARIES_BLOCK >>>
boundaries:
  frontend:
    - "apps/web/**"
    - "apps/admin/**"
    - "packages/ui/**"
    - "**/*.tsx"
  backend:
    - "apps/api/**"
    - "services/**"
  shared:
    - "packages/types/**"
    - "packages/proto/**"
  infra:
    - "deploy/**"
    - "terraform/**"
    - ".github/workflows/**"
# <<< BOUNDARIES_BLOCK <<<

ignore:
  - "**/*.generated.*"
  - "**/*.gen.*"
  - "**/dist/**"
  - "**/build/**"

# >>> ADAPTERS_BLOCK >>>
# <<< ADAPTERS_BLOCK <<<

output:
  ir:
    path: ".codegraph/ir.json"
    pretty: false
  cache:
    path: ".codegraph/cache"
    enabled: true
