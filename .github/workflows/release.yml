# Release workflow for the Plinth monorepo.
#
# Two independent flows live in this file:
#
#   1. npm packages (everything under packages/* and adapters/* except
#      @codegraph/action). Driven by Changesets:
#        - Push to main → open / update a "Version Packages" PR.
#        - Merge of that PR → publish bumped packages to npm with
#          provenance, push git tags.
#
#   2. The GitHub Action package (@codegraph/action). Published by
#      pushing a tag of the form `action-v<MAJOR>.<MINOR>.<PATCH>`.
#      The job bundles the action and force-pushes its dist/ to the
#      exact-version tag (e.g. v1.4.0) and the major-version moving
#      tag (e.g. v1) so consumers can `uses: plinth/action@v1`. See
#      scripts/publish-action.sh for the mechanics.
#
# Why separate flows? Per STRUCTURE.md §6, npm packages and the
# Action's tag-based distribution have fundamentally different cadences
# and consumer contracts. Bundling them into one release would force
# every Action bump to also bump npm packages, which is the opposite
# of independent versioning.

name: release

on:
  push:
    branches: [main]
    tags:
      - "action-v*"

# Top-level permissions are intentionally minimal. Each job widens
# them only to what it actually needs.
permissions:
  contents: read

# Don't let two release runs race on main. The Version Packages PR
# logic in particular is not safe to run concurrently — it reads and
# writes the same PR.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------
  # Job 1: npm release via Changesets.
  #
  # Skipped when the trigger is a tag push (those are handled by the
  # release-action job below).
  # --------------------------------------------------------------
  release-npm:
    name: Release npm packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write          # changesets pushes tags + the Version PR branch
      pull-requests: write     # opens / updates the Version Packages PR
      id-token: write          # required for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so changeset can compute changelog diffs and
          # tag previously released commits accurately.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Pin matches package.json#packageManager. Corepack picks
          # this up locally; CI sets it explicitly.
          version: 9.12.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pre-publish sanity checks
        # Verifies the tree is publishable: every non-private package
        # has the required fields, no `workspace:*` leaks, IR schema
        # version aligns with adapter-sdk peerDependencies, etc. See
        # scripts/release-check.ts for the full list.
        run: pnpm tsx scripts/release-check.ts

      - name: Build all publishable packages
        # Filtered to the workspaces the changesets action will
        # actually publish. Adapters too — they're independent
        # packages on npm even if they share a directory.
        run: pnpm turbo run build --filter='./packages/*' --filter='./adapters/*'

      - name: Run tests
        # Last gate before the Changesets action gets to mutate the
        # repo or publish. If anything below this is red, we should
        # not be cutting a release.
        run: pnpm turbo run lint typecheck test

      - name: Create Release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          # `version`: how to bump versions when consuming changesets.
          #   - Runs `pnpm version-packages` (see root package.json),
          #     which calls `changeset version` then refreshes the
          #     lockfile.
          # `publish`: how to publish once the Version Packages PR
          #   merges back to main.
          #   - Runs `pnpm release`, which builds publishable packages
          #     then runs `changeset publish` (npm publish + git tag).
          #   - We pass --provenance via NPM_CONFIG_PROVENANCE below.
          version: pnpm version-packages
          publish: pnpm release
          # Title and commit message of the auto-PR. Keep it boring;
          # reviewers should know on sight that this is a Changesets
          # bump and only needs a quick scan.
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
          # Short-lived branch the action force-pushes to.
          branch: changeset-release/main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm provenance — ties the published tarball to this
          # workflow run via Sigstore. Requires the `id-token: write`
          # permission above and a registry-url set on setup-node.
          NPM_CONFIG_PROVENANCE: "true"

      - name: Summary
        if: steps.changesets.outputs.published == 'true'
        # `published` is set by the Changesets action when it actually
        # ran `changeset publish`. We use it to log what landed; the
        # action also pushes git tags so we don't need to here.
        run: |
          echo "Published packages:"
          echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | "  - \(.name)@\(.version)"'

  # --------------------------------------------------------------
  # Job 2: GitHub Action release.
  #
  # Triggered by a tag of the form `action-v<X.Y.Z>` pushed to the
  # repo. The publish script computes the major-version moving tag
  # from the input and pushes the bundled dist/ to both refs.
  # --------------------------------------------------------------
  release-action:
    name: Release GitHub Action
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/action-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write          # force-push the major and exact tags
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build action bundle
        # Builds the upstream packages first (cli + core), then ncc-
        # bundles the action into packages/action/dist/. STRUCTURE.md
        # §4.4 documents that dist/ is the published artifact.
        run: pnpm turbo run build --filter=@codegraph/action

      - name: Verify bundled action is up to date
        # If a maintainer tagged a release without committing the
        # latest dist/, fail loudly. The PR-time CI also checks this,
        # but tags can come from anywhere — verify here too.
        run: |
          if [ -n "$(git status --porcelain packages/action/dist)" ]; then
            echo "::error::packages/action/dist/ is stale relative to source. Re-run the action build and commit before tagging."
            git status --porcelain packages/action/dist
            exit 1
          fi

      - name: Publish action dist/ to release tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The tag that triggered this run, e.g. `action-v1.4.0`.
          # The publish script strips the `action-` prefix and
          # derives `v1.4.0` (exact) and `v1` (moving major) refs.
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/publish-action.sh
