name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast (build + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    defaults:
      run:
        working-directory: mvp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mvp/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: View model smoke
        run: npm run smoke:view-model

      - name: MCP stdio smoke
        run: npm run smoke:mcp

  determinism:
    name: determinism (double-build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    defaults:
      run:
        working-directory: mvp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mvp/package-lock.json

      - name: Install
        run: npm ci

      - name: First build
        run: npm run build

      - name: Save first build
        run: cp -R dist ../dist-first

      - name: Second build
        run: |
          rm -rf dist
          npm run build

      - name: Compare builds
        run: diff -qr dist ../dist-first

  required:
    name: required
    if: always()
    needs: [fast, determinism]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        run: |
          if [ "${{ needs.fast.result }}" != "success" ] || \
             [ "${{ needs.determinism.result }}" != "success" ]; then
            echo "fast=${{ needs.fast.result }}"
            echo "determinism=${{ needs.determinism.result }}"
            exit 1
          fi
          echo "All required jobs passed."
