<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ryngo logo lab</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #fbfaf2;
        --panel: #f4f1e3;
        --line: #d8d3b4;
        --text: #1a1a1a;
        --muted: #5a5a5a;
        --blue: #1d4ed8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 18px 28px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      h1 {
        margin: 0;
        font-size: 18px;
      }
      a {
        color: var(--blue);
        text-decoration: none;
      }
      main {
        max-width: 1420px;
        margin: 0 auto;
        padding: 32px 24px 56px;
      }
      .lede {
        max-width: 820px;
        margin: 0 0 24px;
        color: var(--muted);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
        gap: 16px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
      }
      .card.is-favorite {
        border-color: #1d4ed8;
        box-shadow: 0 0 0 2px color-mix(in oklab, #1d4ed8 20%, transparent);
      }
      .mark {
        display: grid;
        place-items: center;
        height: 166px;
        background: color-mix(in oklab, var(--bg) 75%, #ffffff 25%);
        border: 1px solid var(--line);
        border-radius: 7px;
        overflow: hidden;
      }
      .card h2 {
        margin: 12px 0 4px;
        font-size: 14px;
      }
      .card p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        margin: 0 0 0 6px;
        border: 1px solid color-mix(in oklab, var(--blue) 45%, var(--line));
        border-radius: 999px;
        padding: 2px 7px;
        color: var(--blue);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0;
        vertical-align: 1px;
      }
      .mono {
        font-family: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
      }
      svg {
        display: block;
        overflow: visible;
      }
      @media (max-width: 640px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }
        main {
          padding-inline: 14px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Ryngo logo lab</h1>
      <nav>
        <a href="index.html">home</a>
        <span class="mono"> · </span>
        <a href="/app">app</a>
      </nav>
    </header>
    <main>
      <p class="lede">
        Thirty SVG directions focused on one idea: the word <strong>Ryngo</strong>
        as a layered 3D code object. No node marks here — just front-to-back
        strata, extrusion, contour depth, and clean wordmark geometry.
      </p>
      <div id="grid" class="grid"></div>
    </main>
    <script>
      const variants = [
        ["Single Faint Shadow", "One quiet rear layer: barely-dimensional, most logo-safe.", { depth: 1, tilt: -1.0, palette: 0, fill: "solid", faint: true, scale: 3.0 }],
        ["Double Faint Shadow", "Two soft offset layers behind the main word.", { depth: 2, tilt: -1.0, palette: 0, fill: "solid", faint: true, scale: 3.0 }],
        ["Single Volt Shadow", "One bright accent layer peeking behind a dark face.", { depth: 1, tilt: -1.15, palette: 2, fill: "solid", faint: true, scale: 3.3 }],
        ["Double Warm Shadow", "Two warm strata, subtle enough for a header lockup.", { depth: 2, tilt: -0.8, palette: 5, fill: "solid", faint: true, scale: 3.6 }],
        ["One-Layer Outline", "A single rear contour behind an outlined face.", { depth: 1, tilt: -1.1, palette: 1, fill: "outline", faint: true, scale: 3.2 }],
        ["Two-Layer Outline", "Light architectural depth without full extrusion.", { depth: 2, tilt: -1.2, palette: 1, fill: "outline", faint: true, scale: 3.0 }],
        ["Layered Product Mark", "Clean baseline: readable front face, quiet depth stack.", { depth: 4, tilt: -1.1, palette: 0, fill: "solid" }],
        ["Soft Offset", "Gentler depth for a friendlier landing-page mark.", { depth: 4, tilt: -0.75, palette: 4, fill: "solid" }],
        ["Layer Labels", "Subtle front/back guide lines under the wordmark.", { depth: 5, tilt: -1.1, palette: 5, fill: "solid", guides: true }],
        ["Dark App Tile", "App-icon-ready dark tile with modest wordmark depth.", { depth: 3, tilt: -1.2, palette: 6, fill: "volt", tile: true, faint: true }],
        ["Baseline Stack", "Depth sits mostly under the text baseline.", { depth: 5, tilt: -0.55, palette: 0, fill: "solid", scale: 3.1 }],
        ["Thin Wireframe", "Architectural layer slices with an outlined face.", { depth: 6, tilt: -1.2, palette: 1, fill: "outline" }],
        ["Monoline Stack", "Thin editorial outline version.", { depth: 6, tilt: -1.0, palette: 1, fill: "outline" }],
        ["Perspective Slab", "The word recedes as a slab from front left to back right.", { depth: 9, tilt: -1.8, palette: 5, fill: "solid" }],
        ["Blueprint Stack", "Technical wireframe direction for docs or MCP.", { depth: 8, tilt: -0.95, palette: 7, fill: "outline", guides: true }],
        ["Compressed Front", "Back layers visibly compress into the front word.", { depth: 10, tilt: -1.55, palette: 5, fill: "solid", compress: true }],
        ["Glass Layers", "Transparent stacked text planes.", { depth: 7, tilt: -1.2, palette: 7, fill: "glass" }],
        ["Layered R Emphasis", "R gets the deepest extrusion, word follows.", { depth: 7, tilt: -1.3, palette: 0, fill: "solid", rEmphasis: true }],
        ["Deep Stack", "More dimensional layering from front to back.", { depth: 10, tilt: -1.4, palette: 0, fill: "solid" }],
        ["Compiler Stack", "Strong back-to-front planes, built like a compilation stack.", { depth: 8, tilt: -1.6, palette: 3, fill: "solid" }],
        ["Heavy Slab", "Boldest front face with dense rear layers.", { depth: 9, tilt: -1.1, palette: 0, fill: "solid", weight: 900 }],
        ["Vertical Stack", "Layers drop down more than sideways.", { depth: 8, tilt: -2.2, palette: 3, fill: "solid", scale: 2.1 }],
        ["Horizontal Stack", "Layers slide behind the word horizontally.", { depth: 9, tilt: -0.2, palette: 4, fill: "solid", scale: 4.4 }],
        ["Contour Shadow", "Contour rings in the rear, strong plain front.", { depth: 12, tilt: -0.85, palette: 1, fill: "solid", banded: true }],
        ["Neon Stack", "High contrast for dark-mode hero treatments.", { depth: 7, tilt: -1.3, palette: 6, fill: "volt", tile: true }],
        ["Minimal Layer", "Fewest layers while still reading as depth.", { depth: 3, tilt: -1.0, palette: 0, fill: "solid" }],
        ["Nested Planes", "Alternating opacity planes behind the word.", { depth: 9, tilt: -1.25, palette: 7, fill: "glass", banded: true }],
        ["Backlit Ryngo", "Light rear stack behind a dark front face.", { depth: 8, tilt: -1.15, palette: 2, fill: "solid", glow: true }],
        ["Balanced Brand", "Most conventional logo lockup candidate.", { depth: 5, tilt: -1.1, palette: 4, fill: "solid" }],
        ["Tiny App Mark", "Reduced for favicon/app icon, still layered.", { depth: 5, tilt: -1.4, palette: 6, fill: "volt", tile: true, compact: true }],
      ];

      const palettes = [
        { face: "#111827", side: "#8fa23b", bg: "#fffdf7", guide: "#1d4ed8" },
        { face: "#172033", side: "#d8d3b4", bg: "#fffdf7", guide: "#7e22ce" },
        { face: "#030712", side: "#3f6212", bg: "#fbfaf2", guide: "#60a5fa" },
        { face: "#1f2937", side: "#b45309", bg: "#fff7ed", guide: "#15803d" },
        { face: "#0f172a", side: "#64748b", bg: "#f8fafc", guide: "#c8ff3d" },
        { face: "#1a1a1a", side: "#b9b394", bg: "#fbfaf2", guide: "#92400e" },
        { face: "#c8ff3d", side: "#1d4ed8", bg: "#030712", guide: "#60a5fa" },
        { face: "#0e7490", side: "#d8d3b4", bg: "#fbfaf2", guide: "#5a8a00" },
      ];

      function logoSvg(config, i) {
        const p = palettes[config.palette];
        const textX = config.compact ? 32 : 20;
        const textY = config.compact ? 62 : 60;
        const size = config.compact ? 42 : 44;
        const word = "Ryngo";
        const width = config.compact ? 270 : 292;
        const depth = Array.from({ length: config.depth }, (_, idx) => {
          const layer = config.depth - idx;
          const dx = layer * (config.scale || 3.2);
          const dy = layer * Math.abs(config.tilt);
          const opacity = config.faint
            ? 0.055 + idx * 0.045
            : config.banded
            ? 0.12 + (idx % 2) * 0.18
            : 0.08 + idx * (0.28 / Math.max(1, config.depth - 1));
          const letterSpacing = config.compress ? -2.5 + layer * 0.08 : -2.5;
          const rBoost = config.rEmphasis && idx < 3
            ? `<text x="${textX + dx - 1}" y="${textY + dy}" class="word layer r-only" fill="${p.side}" fill-opacity="${Math.min(0.42, opacity + 0.14)}">R</text>`
            : "";
          return `${rBoost}<text x="${textX + dx}" y="${textY + dy}" class="word layer" style="letter-spacing:${letterSpacing}px" fill="${p.side}" fill-opacity="${opacity}">${word}</text>`;
        }).join("");
        const faceFill =
          config.fill === "outline" ? "none" :
          config.fill === "volt" ? p.face :
          config.fill === "glass" ? `${p.face}" fill-opacity="0.64` :
          p.face;
        const faceStroke = config.fill === "outline" || config.fill === "glass" ? `stroke="${p.face}" stroke-width="1.8"` : "";
        const guideLines = config.guides ? `
          <path d="M26 76H256M30 83H248" stroke="${p.guide}" stroke-width="1.4" stroke-dasharray="5 6" opacity=".55"/>
          <text x="31" y="91" font-size="7" fill="${p.side}" opacity=".75">frontend · backend · data · infra</text>
        ` : "";
        const tile = config.tile ? `<rect x="7" y="7" width="${width - 14}" height="108" rx="18" fill="${p.bg}" stroke="${p.guide}" stroke-opacity=".35"/>` : "";
        const glow = config.glow ? `<text x="${textX + 18}" y="${textY + 8}" class="word layer" fill="${p.side}" fill-opacity=".18">${word}</text>` : "";
        return `
          <svg width="100%" height="132" viewBox="0 0 ${width} 124" aria-label="Ryngo layered logo option ${i + 1}">
            <defs>
              <filter id="shadow-${i}" x="-20%" y="-20%" width="140%" height="150%">
                <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#030712" flood-opacity=".16"/>
              </filter>
            </defs>
            <style>
              .word { font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: ${size}px; font-weight: 850; letter-spacing: -2.5px; }
              .layer { paint-order: stroke; stroke: ${p.bg}; stroke-width: .7px; }
            </style>
            <rect x="0" y="0" width="${width}" height="124" rx="14" fill="${p.bg}"/>
            ${tile}
            <g filter="url(#shadow-${i})">
              ${glow}
              ${depth}
              <text x="${textX}" y="${textY}" class="word" fill="${faceFill}" ${faceStroke}>${word}</text>
            </g>
            ${guideLines}
          </svg>
        `;
      }

      document.getElementById("grid").innerHTML = variants.map(([name, desc, config], i) => `
        <article class="card ${i === 0 ? "is-favorite" : ""}">
          <div class="mark">${logoSvg(config, i)}</div>
          <h2>${String(i + 1).padStart(2, "0")} · ${name}${i === 0 ? "<span class=\"badge\">favorite direction</span>" : ""}</h2>
          <p>${desc}</p>
        </article>
      `).join("");
    </script>
  </body>
</html>
